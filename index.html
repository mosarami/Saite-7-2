<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ورود به پنل مدرسه</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">

  <div class="login-box">
    <h1>پنل مدرسه</h1>
    <p class="subtitle">رمز عبور خود را وارد کنید</p>
    <form id="loginForm">
      <input type="text" id="password" placeholder="رمز عبور" required autofocus autocomplete="off">
      <button type="submit">ورود</button>
    </form>
    <p id="message"></p>
  </div>

  <!-- بنر بزرگ پایین صفحه -->
  <div class="banner-container">
    <img src="banner.jpg" alt="بنر مدرسه" class="banner-img">
  </div>

  <script src="app.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const password = document.getElementById('password').value;
      const msg = document.getElementById('message');
      const user = Auth.login(password);

      if (!user) {
        msg.textContent = 'رمز اشتباه است';
        msg.className = 'error';
        return;
      }

      msg.textContent = 'در حال ورود...';
      msg.className = '';
      setTimeout(() => {
        window.location.href = user.role === 'teacher' ? 'teacher.html' : 'dashboard.html';
      }, 300);
    });
  </script>
</body>
</html>
